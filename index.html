<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riffwell</title>
<meta name="description" content="Çevrimdışı müzik çalar ve ses efektleri">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riffwell">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="riffwell-dark-180.png">
<link rel="icon" type="image/png" href="riffwell-dark-192.png">
<style>
/* Layout: Liquid Glass. Kapak renginden beslenen ortam katmanı üzerinde yüzen cam yüzeyler; sayfa yığını, yüzen kapsül sekme çubuğu + ayrı arama düğmesi, üstünde cam mini çalar. */
:root{
  --bg:#ECEEF5;--fg:#0B0C10;--muted:rgba(22,24,34,.68);--line:rgba(22,24,34,.09);
  --accent:#FF2D55;--accent-ink:#E01E48;--accent-soft:rgba(255,45,85,.14);--on-accent:#FFFFFF;--danger:#FF3B30;
  --glass:rgba(255,255,255,.17);--glass-strong:rgba(255,255,255,.3);--glass-hi:rgba(255,255,255,.5);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 .5px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.18),0 8px 24px rgba(30,36,70,.08);
  --solid:#F6F7FB;--track:rgba(22,24,34,.14);--knob:#FFFFFF;--scrim:rgba(245,246,250,.22);
  --tint:#7C8CFF;--tint2:#FF8FB1;--tint3:#5AC8FA;--amb:.9;--blur:26px;
  --sw-blue:#0A84FF;--sw-violet:#8E5CF7;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --tabh:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06070B;--fg:#F5F6FA;--muted:rgba(235,237,247,.68);--line:rgba(255,255,255,.09);
  --accent:#FF375F;--accent-ink:#FF6A88;--accent-soft:rgba(255,55,95,.22);--on-accent:#FFFFFF;--danger:#FF453A;
  --glass:rgba(255,255,255,.075);--glass-strong:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.2);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.12),inset 0 -1px 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.3);
  --solid:#15161C;--track:rgba(255,255,255,.18);--knob:#F2F3F7;--scrim:rgba(6,7,11,.3);--amb:.72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06070B;--fg:#F5F6FA;--muted:rgba(235,237,247,.68);--line:rgba(255,255,255,.09);
  --accent:#FF375F;--accent-ink:#FF6A88;--accent-soft:rgba(255,55,95,.22);--on-accent:#FFFFFF;--danger:#FF453A;
  --glass:rgba(255,255,255,.075);--glass-strong:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.2);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.12),inset 0 -1px 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.3);
  --solid:#15161C;--track:rgba(255,255,255,.18);--knob:#F2F3F7;--scrim:rgba(6,7,11,.3);--amb:.72;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;overscroll-behavior-y:none}img{max-width:100%}
.install{margin:0 0 14px;padding:12px 16px;border-radius:22px;font-size:14px;font-weight:600;color:var(--accent-ink)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;letter-spacing:-.011em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:14px}
svg{flex:none}

/* Cam malzeme */
.install,.glass,.hero,.stat,.tile,.fxcard,.list,.group,.mini,.tabcap,.tabsearch,.btn,.chip,.hdr .ib,select,.field input,.searchbox input,.np-tools,.empty,.toast,.sheet-card{
  background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%) brightness(1.04);backdrop-filter:blur(var(--blur)) saturate(170%) brightness(1.04);box-shadow:var(--glass-shadow);border:0}

/* Ortam katmanı */
.ambient{position:fixed;inset:-15%;z-index:-1;pointer-events:none;opacity:var(--amb);
  background:radial-gradient(46% 36% at 14% 10%,var(--tint),transparent 72%),radial-gradient(42% 34% at 90% 26%,var(--tint2),transparent 72%),radial-gradient(52% 40% at 24% 86%,var(--tint3),transparent 72%),radial-gradient(44% 34% at 86% 82%,var(--tint),transparent 72%),linear-gradient(165deg,color-mix(in srgb,var(--tint) 38%,var(--bg)),color-mix(in srgb,var(--tint3) 34%,var(--bg)));
  filter:saturate(1.25);animation:drift 26s ease-in-out infinite alternate}
@property --tint{syntax:'<color>';inherits:true;initial-value:#7C8CFF}
@property --tint2{syntax:'<color>';inherits:true;initial-value:#FF8FB1}
@property --tint3{syntax:'<color>';inherits:true;initial-value:#5AC8FA}
:root{transition:--tint 1.4s ease,--tint2 1.4s ease,--tint3 1.4s ease}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.06)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:15;background:var(--scrim);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

.shell{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 120px)}

/* Gezinme çubuğu */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:58px;padding-block:8px;margin-inline:-8px;padding-inline:8px;border-radius:0 0 24px 24px;transition:background .25s,box-shadow .25s}
.hdr.scrolled{background:var(--scrim);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.hdr .ttl{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.hdr.scrolled .ttl{opacity:1}
.hdr.root .ttl{opacity:0}
.hdr .ib{width:44px;height:44px}
.hdr-acts{display:flex;gap:8px;justify-content:flex-end;min-width:44px}
.brandmark{display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin:4px 0 22px;text-align:center}
.brandmark img{width:88px;height:88px;border-radius:21px;box-shadow:0 0 0 .5px rgba(255,255,255,.5),0 14px 36px color-mix(in srgb,var(--tint) 45%,transparent),0 4px 12px rgba(0,0,0,.15)}
.logo-big{width:96px;height:96px;border-radius:22px;box-shadow:0 14px 34px rgba(80,40,160,.32)}
.big-ttl{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;margin:0 0 16px;text-wrap:balance;line-height:1.08}
.sub-ttl{color:var(--muted);margin:-10px 0 16px;font-size:14.5px}

.ib{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.ib svg{width:22px;height:22px}
.ib.dim{color:var(--muted)}
.ib.on{color:var(--accent-ink)}

.page.fwd{animation:pin .34s cubic-bezier(.2,.9,.25,1)}
.page.back{animation:pback .28s cubic-bezier(.2,.9,.25,1)}
@keyframes pin{from{transform:translateX(34px) scale(.985);opacity:0;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
@keyframes pback{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .15s}
.btn:active,.chip:active,.tile:active,.card:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn.pri{background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 6px rgba(0,0,0,.12),0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:120px}

.sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 4px 10px}
.sec-h h2{font-family:var(--display);font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em}
.link{border:0;background:none;color:var(--accent-ink);font-weight:500;font-size:16px;padding:4px}

/* Ana sayfa */
.hero{border-radius:28px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
@media (max-width:420px){.hero{grid-template-columns:1fr}}
.hero h3{margin:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{border-radius:20px;padding:12px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:146px;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px;margin-inline:-4px}
.hscroll::-webkit-scrollbar{display:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:24px;padding:14px;text-align:left;display:grid;gap:12px;min-width:0;transition:transform .15s}
.tile .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-weight:600;display:block}
.tile span{font-size:13px;color:var(--muted)}

/* Kapaklar */
.art{width:50px;height:50px;border-radius:12px;overflow:hidden;position:relative;flex:none;background:var(--track)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.5);background:linear-gradient(150deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.06) 30%,transparent 46%)}
.np-art.art::after{display:none}
.vu{z-index:2}
.gen{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#fff;font-size:16px;background:radial-gradient(120% 90% at 20% 12%,hsl(var(--h) 90% 70%),transparent 60%),linear-gradient(145deg,hsl(var(--h) 75% 52%),hsl(calc(var(--h) + 55) 70% 32%))}
.card{border:0;background:transparent;text-align:left;padding:0;display:grid;gap:8px;min-width:0;transition:transform .15s}
.card .art{width:100%;height:auto;aspect-ratio:1;max-width:100%;border-radius:22px;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.card .gen{font-size:32px;display:grid;color:#fff;white-space:normal}
.card b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;padding-inline:2px}
.card span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Gruplu listeler */
.list,.group{list-style:none;margin:0;padding:6px;border-radius:26px;display:grid}
.row{display:grid;grid-template-columns:50px minmax(0,1fr) auto 38px;align-items:center;gap:12px;padding:7px 6px 7px 8px;border-radius:20px;cursor:pointer}
.list>li+li,.group>*+*{position:relative}
.list>li+li::before,.group>*+*::before{content:"";position:absolute;top:0;left:74px;right:12px;height:.5px;background:var(--line);z-index:2}
.row.on .t{color:var(--accent-ink)}
.row.sel{grid-template-columns:26px 50px minmax(0,1fr) auto}
.row.sel input{width:22px;height:22px;accent-color:var(--accent)}
.row .num{font-family:var(--mono);color:var(--muted);font-size:14px;text-align:center;font-weight:600}
.meta{min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.navrow{display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 8px;border:0;background:transparent;width:100%;text-align:left;border-radius:20px}
.navrow:active,.row:active{background:var(--glass-hi)}
.navrow .chev{color:var(--muted);width:16px;height:16px;opacity:.7}
.round{border-radius:50%!important}
.vu{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:14px;background:rgba(0,0,0,.42)}
.vu i{width:4px;background:#fff;border-radius:2px;height:30%;animation:vu .9s ease-in-out infinite}
.vu i:nth-child(2){animation-delay:-.3s}.vu i:nth-child(3){animation-delay:-.6s}
.paused .vu i{animation-play-state:paused}
@keyframes vu{0%,100%{height:25%}50%{height:70%}}

/* Kaydırma eylemleri */
.swipe{position:relative;overflow:hidden;border-radius:20px}
.swipe>.row{position:relative;z-index:1;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .3s cubic-bezier(.2,.9,.25,1),background .2s}
.swipe.show-l>.row,.swipe.show-r>.row{background:var(--solid)}
.sw-l,.sw-r{position:absolute;top:3px;bottom:3px;display:flex;gap:4px;visibility:hidden;padding-inline:4px}
.sw-l{left:0}.sw-r{right:0}
.swipe.show-l .sw-l,.swipe.show-r .sw-r{visibility:visible}
.swb{border:0;width:72px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-content:center;justify-items:center;gap:3px;font-size:11.5px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.swb svg{width:22px;height:22px}
.swipe.full .sw-l{right:0}.swipe.full .sw-l .swb:first-child{flex:1;width:auto}.swipe.full .sw-l .swb:not(:first-child){display:none}
.swipe.full .sw-r{left:0}.swipe.full .sw-r .swb:last-child{flex:1;width:auto}.swipe.full .sw-r .swb:not(:last-child){display:none}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 2px 12px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
select{border-radius:999px;padding:9px 14px;font-size:14px;-webkit-appearance:none;appearance:none}

/* Detay başlığı */
.dhead{display:grid;justify-items:center;text-align:center;gap:8px;margin-bottom:20px}
.dhead .art{width:min(62vw,230px);height:auto;aspect-ratio:1;max-width:100%;border-radius:30px;box-shadow:0 24px 50px color-mix(in srgb,var(--tint) 40%,transparent),0 6px 18px rgba(0,0,0,.15)}
.dhead .gen{font-size:56px}
.dhead h1{font-family:var(--display);font-weight:800;font-size:26px;margin:8px 0 0;letter-spacing:-.025em;text-wrap:balance}
.dhead .by{border:0;background:none;color:var(--accent-ink);font-weight:600;padding:0;font-size:17px}
.dhead .m{color:var(--muted);font-size:13.5px;font-family:var(--mono)}
.dhead .btn-row{width:100%;max-width:420px;margin-top:8px}

.empty{text-align:center;padding:36px 20px;color:var(--muted);display:grid;gap:10px;justify-items:center;border-radius:28px}
.empty h3{font-family:var(--display);color:var(--fg);margin:0;font-size:19px;font-weight:700}
.empty p{margin:0;max-width:34ch}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border-radius:999px;padding:13px 18px;font-size:16px}
.searchbox{position:relative;margin-bottom:18px}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);z-index:1}
.searchbox input{width:100%;border-radius:999px;padding:14px 16px 14px 44px;font-size:17px}
input::placeholder{color:var(--muted)}

/* Kaydırıcılar */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p) 100% no-repeat,var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--knob);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 3px 10px rgba(0,0,0,.22),inset 0 1px 0 #fff}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:var(--knob);box-shadow:0 3px 10px rgba(0,0,0,.22)}
input[type=range]:disabled{opacity:.5}

/* Efektler */
.fxcard{border-radius:28px;padding:16px;display:grid;gap:12px}
.fxcard+.fxcard,.fxbody>.fxcard+.fxcard{margin-top:12px}
.fxbody{margin-top:12px}
.fxh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fxh b{font-weight:600;font-size:16.5px}
.fxh small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.sl{display:grid;grid-template-columns:100px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:14.5px}
.sl output{font-family:var(--mono);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sw{position:relative;display:inline-block;width:62px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background .25s;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:38px;height:26px;border-radius:999px;background:var(--knob);box-shadow:0 2px 8px rgba(0,0,0,.22),inset 0 1px 0 #fff;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+span{background:#34C759}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .15s}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.eqcurve{width:100%;height:84px;display:block}
.eqcols{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end}
.eqcol{display:grid;justify-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:600}
.eqcol output{color:var(--fg)}
.eqcol .slot{position:relative;width:30px;height:128px;display:block}
.eqcol .slot input{position:absolute;left:50%;top:50%;width:128px;height:30px;transform:translate(-50%,-50%) rotate(-90deg)}
.master{background:linear-gradient(135deg,var(--accent-soft),var(--glass))}
.warn{font-size:13px;color:var(--muted);margin:0}
.fxoff .fxbody{opacity:.45;pointer-events:none}

/* Mini çalar ve sekme çubuğu */

.knob::before{content:"";position:absolute;inset:-9%;border-radius:50%;background:conic-gradient(from 225deg,rgba(0,0,0,.28) 0deg,rgba(0,0,0,.28) 270deg,transparent 270deg);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 70%,transparent 71%)}
.knob .tick{position:absolute;width:2px;height:12%;background:#555;left:50%;top:50%;transform-origin:50% 0}
.knob .cap{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 60%,rgba(0,0,0,.25) 61%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),transparent 30%),conic-gradient(from 20deg,#9b9b9f,#636367 45deg,#a2a2a6 90deg,#68686c 135deg,#9e9ea2 180deg,#5f5f63 225deg,#a4a4a8 270deg,#66666a 315deg,#9b9b9f);box-shadow:0 0 0 6px #0f0f10,0 0 0 7px #2a2a2c,0 10px 24px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.25),inset 0 -6px 12px rgba(0,0,0,.35);transition:transform .05s linear}
.knob .cap::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,rgba(255,255,255,.18),transparent 25%,rgba(255,255,255,.12) 50%,transparent 75%,rgba(255,255,255,.18))}
.knob .dot{position:absolute;left:50%;top:9%;width:13%;height:13%;margin-left:-6.5%;border-radius:50%;background:#1d1d1f;box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.2)}
.kc.on .knob .dot{background:#5ad1e6;box-shadow:0 0 10px #5ad1e6,inset 0 1px 1px rgba(255,255,255,.5)}
.knob:focus-visible{box-shadow:0 0 0 3px #5ad1e6}
.kc-ctl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;width:100%}
.kpow,.ksel,.klabel,.kbtn{height:52px;border-radius:5px;border:0;background:linear-gradient(#2a2a2c,#1f1f21);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #4d4d50,0 2px 4px rgba(0,0,0,.4);color:#f2f2f4;font-size:18px}
.kpow{display:grid;place-items:center;background:linear-gradient(#4a4a4d,#3a3a3d);color:#cfcfd3}
.kpow svg{width:26px;height:26px}
.kc.on .kpow{color:#5ad1e6}
.ksel{-webkit-appearance:none;appearance:none;width:100%;min-width:0;padding:0 24px 0 6px;font-size:16.5px;text-align:center;text-align-last:center;background-image:linear-gradient(45deg,transparent 50%,#d0d0d4 50%),linear-gradient(-45deg,transparent 50%,#d0d0d4 50%),linear-gradient(#2a2a2c,#1f1f21);background-size:8px 8px,8px 8px,100% 100%;background-position:calc(100% - 17px) 50%,calc(100% - 9px) 50%,0 0;background-repeat:no-repeat}
.klabel{display:grid;place-items:center;padding:0 8px}
.kside{display:grid;gap:14px;align-content:center;width:100%}
.kbtn{width:100%;font-size:19px}
.kbtn:active,.kpow:active,.kp-x:active,.kp-preset:active{filter:brightness(1.2)}
.kpair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kp-note{grid-column:1/-1;margin:0;color:#a9a9ad;font-size:13px;text-align:center}
@media (max-width:360px){.kp-grid{gap:34px 14px}.kc-ctl{grid-template-columns:44px minmax(0,1fr);gap:8px}.kpow,.ksel,.klabel,.kbtn{height:46px;font-size:16px}}

/* ===== Metal görünüm (jetAudio tasarım dili) ===== */
html.skin-metal.skin-metal:root{--bg:#3b3b3e;--fg:#f2f2f4;--muted:#a9a9ae;--line:rgba(0,0,0,.5);--accent:#5ad1e6;--accent-ink:#5ad1e6;--accent-soft:rgba(90,209,230,.15);--on-accent:#06262c;--danger:#ff6b5e;--glass:#323235;--glass-strong:#2e2e31;--glass-hi:#46464a;--glass-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px #1e1e20,0 2px 6px rgba(0,0,0,.35);--track:#1a1a1c;--knob:#d4d4d8;--scrim:#2e2e31;--amb:0;--solid:#323235;color-scheme:dark}
.skin-metal body{background:linear-gradient(#3e3e41,#343437) fixed;color:var(--fg)}
.skin-metal body::before{background:#2e2e31;-webkit-backdrop-filter:none;backdrop-filter:none}
/* paneller */
.skin-metal :is(.hero,.stat,.tile,.fxcard,.list,.group,.empty){background:linear-gradient(#37373b,#303033);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px #1d1d1f,0 3px 8px rgba(0,0,0,.35)}
.skin-metal .master{background:linear-gradient(#3c3c40,#2f2f32)}
.skin-metal :is(.list,.group){padding:0;overflow:hidden}
.skin-metal :is(.row,.navrow,.swipe){border-radius:0}
.skin-metal :is(.row,.navrow){padding-left:12px;padding-right:10px}
.skin-metal :is(.list>li+li,.group>*+*)::before{left:0;right:0;height:1px;background:#1d1d1f;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.skin-metal .group>.big+.big::before{left:0}
.skin-metal :is(.navrow,.row):active{background:#46464a}
.skin-metal .swipe.show-l>.row,.skin-metal .swipe.show-r>.row{background:#323235}
.skin-metal .swb{border-radius:4px}
.skin-metal .art{border-radius:6px;box-shadow:0 0 0 1px #111,0 2px 5px rgba(0,0,0,.4)}
.skin-metal .art::after{display:none}
.skin-metal .navrow.big .art{border-radius:8px;box-shadow:0 0 0 2px #111,0 0 0 3px #4a4a4e,0 4px 10px rgba(0,0,0,.5)}
.skin-metal .card .art{border-radius:8px;box-shadow:0 0 0 2px #111,0 0 0 3px #4a4a4e,0 6px 14px rgba(0,0,0,.5)}
.skin-metal .dhead .art{border-radius:10px;box-shadow:0 0 0 3px #111,0 0 0 4px #4a4a4e,0 14px 30px rgba(0,0,0,.55)}
.skin-metal .tile .ic{background:linear-gradient(#2c2c2f,#1f1f21);box-shadow:0 0 0 1px #4d4d50;color:var(--accent);border-radius:8px}
/* üst çubuk */
.skin-metal .hdr,.skin-metal .hdr.scrolled{background:#2e2e31;box-shadow:0 0 0 100vmax #2e2e31,0 1px 0 #1d1d1f;clip-path:inset(0 -100vmax -1px);border-radius:0}
.skin-metal :is(.hdr .ib,.capsule){background:linear-gradient(#cbcbce,#9f9fa3);color:#1c1c1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 2px 6px rgba(0,0,0,.4)}
.skin-metal .hdr .capsule .ib{background:none;box-shadow:none;color:#1c1c1e}
.skin-metal .hdr .ttl small{color:#a9a9ae}
/* alanlar ve butonlar */
.skin-metal :is(.searchbox input,.field input){background:#232325;color:var(--fg);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 1px #4a4a4e}
.skin-metal select{background-color:#232325;color:var(--fg);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px #4d4d50}
.skin-metal .btn{background:linear-gradient(#2d2d30,#1f1f21);border-radius:6px;color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #4d4d50,0 2px 4px rgba(0,0,0,.4)}
.skin-metal .btn.pri{background:linear-gradient(#4b4b4f,#38383b);color:var(--accent)}
.skin-metal .btn.danger{color:var(--danger)}
.skin-metal .chip{background:linear-gradient(#2d2d30,#1f1f21);border-radius:6px;color:#d8d8dc;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #4d4d50}
.skin-metal .chip[aria-pressed="true"]{background:linear-gradient(#1c1c1e,#29292b);color:var(--accent);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1px var(--accent)}
.skin-metal .link,.skin-metal .dhead .by,.skin-metal .brandmark{color:var(--accent)}
.skin-metal .sw span{background:#1a1a1c;box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 0 0 1px #4d4d50}
.skin-metal .sw span::after{background:linear-gradient(#dcdce0,#a2a2a6)}
.skin-metal .sw input:checked+span{background:#1a1a1c;box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 0 0 1px var(--accent),0 0 8px rgba(90,209,230,.35)}
.skin-metal .sw input:checked+span::after{background:linear-gradient(#c4f3fb,#5ad1e6)}
.skin-metal input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p) 100% no-repeat,#1a1a1c;box-shadow:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06)}
.skin-metal input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 50% 35%,#ececef,#9a9a9e);box-shadow:0 0 0 1px #111,0 2px 6px rgba(0,0,0,.6)}
.skin-metal .np input[type=range]::-webkit-slider-thumb{width:46px;height:28px;border-radius:14px;margin-top:-11px}
.skin-metal input[type=range]::-moz-range-progress{background:var(--accent)}
.skin-metal .eqcurve path:first-of-type{opacity:.4}
/* mini çalar */
.skin-metal .mini{background:#121214!important;box-shadow:0 -1px 0 #2a2a2c}
.skin-metal .mini .prog{background:#3a3a3d}
.skin-metal .mini .prog i{background:#d0d0d4}
.skin-metal .mini .art{border-radius:6px}
.skin-metal .mini .qpos{background:#2e2e31;color:#d0d0d4;border-radius:5px}
/* yan menü */
.skin-metal .dr-panel{background:linear-gradient(#303033,#232325);box-shadow:8px 0 30px rgba(0,0,0,.5)}
.skin-metal .dr-head{background:linear-gradient(#a7a29c,#8e8983);color:#faf8f5}
.skin-metal .dr-item{border-top:1px solid #1a1a1c;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);background:linear-gradient(#3a3a3d,#2e2e31)}
.skin-metal .dr-item svg{color:#c8c8cc}
.skin-metal .dr-item[aria-current="page"]{background:linear-gradient(#4b4b4f,#3c3c40)}
.skin-metal .dr-item[aria-current="page"] svg{color:var(--accent)}
/* alt panel ve bildirim */
.skin-metal .sheet-card{background:#2e2e31;border-radius:14px 14px 0 0;box-shadow:0 -1px 0 #4d4d50,0 -10px 30px rgba(0,0,0,.5)}
.skin-metal .opt{border-radius:0;border-top:1px solid #1d1d1f}
.skin-metal .opt svg{color:var(--accent)}
.skin-metal .opt.danger,.skin-metal .opt.danger svg{color:var(--danger)}
.skin-metal .toast{background:#1c1c1e;color:#f2f2f4;border-radius:8px;box-shadow:0 0 0 1px #4d4d50,0 6px 18px rgba(0,0,0,.5)}
.skin-metal .az b{color:var(--accent)}
/* çalıyor ekranı */
.skin-metal .np{--wave-on:#5ad1e6;--accent-ink:#5ad1e6;background:#2e2e31}
.skin-metal .np .np-top .ib{background:linear-gradient(#cbcbce,#9f9fa3)!important;color:#1c1c1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 2px 6px rgba(0,0,0,.4)!important}
.skin-metal .np .qpos{background:#1c1c1e;box-shadow:0 0 0 1px #4d4d50;border-radius:5px}
.skin-metal .np .np-art{box-shadow:0 0 0 4px #111,0 0 0 5px #4a4a4e,0 30px 70px rgba(0,0,0,.55)}

/* ===== Tek ekran ana sayfa ===== */
body.home-mode{min-height:0}
body.home-mode .shell{padding-block-end:0}
.page.home{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 70px - var(--mini-h,12px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 70px - var(--mini-h,12px));overflow:hidden;display:flex;flex-direction:column}
body.has-mini{--mini-h:86px}
.hm{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(6px,1.4dvh,16px);padding-bottom:2px}
.hm-brand{display:flex;flex-direction:column;align-items:center;gap:clamp(3px,.8dvh,8px);text-align:center}
.hm-brand img{width:clamp(54px,9.5dvh,96px);height:auto;aspect-ratio:1;border-radius:22.4%;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.5),0 6px 24px rgba(255,45,95,.18)}
.hm-brand span{font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink)}
.hm-brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6dvh,32px);letter-spacing:-.03em;line-height:1.1}
.hm-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hm-stats .stat{padding:clamp(6px,1.1dvh,12px) 10px;border-radius:14px}
.hm-stats .stat b{font-size:clamp(15px,2.3dvh,20px)}
.hm-stats .stat span{font-size:11.5px}
.hero.hm-hero{padding:clamp(9px,1.5dvh,16px) 14px;border-radius:18px;grid-template-columns:minmax(0,1fr) auto}
.hm-hero h3{font-size:16px}.hm-hero p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:2px}
.hm-hero .btn-row{flex-wrap:nowrap;gap:8px}.hm-hero .btn{flex:none;min-width:0;padding:9px 13px;font-size:14px}
.hm-sec{min-height:0;display:flex;flex-direction:column}
.hm-sec .sec-h{margin:0 2px 8px}
.hm-sec .sec-h h2{font-size:18px}
.hm-row{--hc:clamp(76px,13dvh,132px);display:grid;grid-auto-flow:column;grid-auto-columns:var(--hc);gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.hm-row::-webkit-scrollbar{display:none}
.hm-card{border:0;background:none;padding:0;color:inherit;text-align:left;display:grid;gap:5px;min-width:0}
.hm-card .art{width:var(--hc);height:var(--hc);border-radius:14px}
.hm-card .gen{font-size:22px}
.hm-card b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-card span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.hm-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hm-tiles .tile{padding:clamp(8px,1.3dvh,14px) 4px;justify-items:center;text-align:center;gap:6px;border-radius:16px}
.hm-tiles .tile .ic{width:clamp(32px,4.8dvh,42px);height:clamp(32px,4.8dvh,42px)}
.hm-tiles .tile b{font-size:12.5px;font-weight:600}
.hm .empty{padding:20px}

/* ===== Efekt paneli: ekrana sığdırma ve yan paneller ===== */

$('#sp').addEventListener('pointermove',e=>{if(!spDrag||e.pointerId!==spDrag.pid)return;spSet(spDrag.id,spDrag.n+((spDrag.y-e.clientY)+(e.clientX-spDrag.x)*.5)*.5)});
['pointerup','pointercancel'].forEach(v=>$('#sp').addEventListener(v,()=>{spDrag=null}));
$('#sp').addEventListener('keydown',e=>{const kn=e.target.closest('.knob.sk');if(!kn)return;const st={ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5}[e.key];if(st){e.preventDefault();const id=kn.id.slice(3);spSet(id,spN(id)+st)}});
